# 診断要約の設定ファイル
# ラベルシステムの拡張やスコア閾値の調整に対応

diagnostic_thresholds:
  beginner_suitability:
    high: 70  # 70 以上なら「初心者向けに特化」と言語化
    medium: 40
    low: 0
  theme_diversity:
    high: 60  # 複数テーマを扱う多角的コンテンツ
    medium: 30
    low: 0
  content_diversity:
    high: 70
    medium: 40
    low: 0

